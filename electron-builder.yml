appId: com.aiolists.desktop
productName: AIOLists
directories:
  output: release
files:
  - dist-desktop/**
  - dist-electron/**
  - package.json
win:
  target:
    - target: nsis
      arch: x64
  # Unsigned for now: Windows SmartScreen will warn on first run.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: AIOLists-Setup-${version}.${ext}
